<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Deepinder Singh</title>

    <!-- Cloudflare Pages serves this page for any missing path, so asset paths are root-relative -->
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <script>
        (function () {
            try {
                var p = localStorage.getItem("portfolio-theme") || "system";
                var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div class="container">
        <main class="not-found">
            <p class="eyebrow">404</p>
            <h1>Page not found</h1>
            <p class="not-found__text">This page doesn't exist or has moved.</p>
            <a href="/" class="buttons">Back to the homepage</a>
        </main>
    </div>
</body>

</html>
